name: Build Windows application

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ffmpeg = Get-ChildItem ffmpeg-extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg download did not contain ffmpeg.exe" }
          Copy-Item $ffmpeg.FullName tools/ffmpeg.exe -Force
          curl.exe -L --fail -o exiftool.zip "https://sourceforge.net/projects/exiftool/files/exiftool-13.59_64.zip/download"
          Expand-Archive -Path exiftool.zip -DestinationPath exiftool-extracted -Force
          $exiftool = Get-ChildItem exiftool-extracted -Filter "exiftool(-k).exe" -Recurse | Select-Object -First 1
          if (-not $exiftool) { throw "ExifTool executable was not found after download" }
          Copy-Item $exiftool.FullName tools/exiftool.exe -Force
          Copy-Item (Join-Path $exiftool.Directory.FullName "exiftool_files") tools/exiftool_files -Recurse -Force
          & tools/ffmpeg.exe -version
          & tools/exiftool.exe -ver
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build Windows application
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --windowed --name MediaMetadataMerge --add-binary "tools\ffmpeg.exe;tools" --add-binary "tools\exiftool.exe;tools" app.py
          if not exist "dist\MediaMetadataMerge\tools" mkdir "dist\MediaMetadataMerge\tools"
          copy /Y "tools\ffmpeg.exe" "dist\MediaMetadataMerge\tools\ffmpeg.exe"
          copy /Y "tools\exiftool.exe" "dist\MediaMetadataMerge\tools\exiftool.exe"
          xcopy /E /I /Y "tools\exiftool_files" "dist\MediaMetadataMerge\tools\exiftool_files"
      - name: Check the finished application
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MediaMetadataMerge/MediaMetadataMerge.exe")) { throw "The EXE was not created" }
          if (-not (Test-Path "dist/MediaMetadataMerge/tools/ffmpeg.exe")) { throw "FFmpeg is missing from the application" }
          if (-not (Test-Path "dist/MediaMetadataMerge/tools/exiftool.exe")) { throw "ExifTool is missing from the application" }
          if (-not (Test-Path "dist/MediaMetadataMerge/tools/exiftool_files")) { throw "ExifTool support files are missing from the application" }
      - name: Create download ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/MediaMetadataMerge -DestinationPath MediaMetadataMerge-windows-x64.zip
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MediaMetadataMerge-windows-x64
          path: MediaMetadataMerge-windows-x64.zip
          if-no-files-found: error
          retention-days: 90
